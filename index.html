<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Tester Avanzado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="./css/index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script src="./js/index.js" defer></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Python Tester Avanzado</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="code" class="form-label">Código Python</label>
                    <textarea id="code" class="form-control" rows="15">class Persona:
    def __init__(self, nombre="Anónimo"):
        self.nombre = nombre
        print(f"Persona {self.nombre} creada")
    
    def saludar(self):
        print(f"{self.nombre} está saludando")
        return f"Hola, soy {self.nombre}"
    
    def caminar(self, pasos):
        print(f"{self.nombre} caminó {pasos} pasos")
        return f"Caminé {pasos} pasos"
    
    @staticmethod
    def metodo_estatico():
        print("Método estático llamado")
        return "Soy estático"

class Calculadora:
    def __init__(self, marca):
        self.marca = marca
        print(f"Calculadora {marca} creada")
    
    def sumar(self, a, b):
        print(f"Sumando {a} + {b} con {self.marca}")
        return a + b

def funcion_simple(x):
    print(f"Función simple con {x}")
    return x * 2</textarea>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="test-cases" class="form-label">Casos de Prueba (JSON)</label>
                    <textarea id="test-cases" class="form-control" rows="15">{
    "funcion_simple": [
        {
            "args": {"x": 5},
            "expected": 10,
            "description": "Función simple básica"
        }
    ],
    "Persona.saludar": [
        {
            "instanceArgs": {"nombre": "Juan"},
            "args": {},
            "expected": "Hola, soy Juan",
            "description": "Saludo con nombre"
        },
        {
            "instanceArgs": {},
            "args": {},
            "expected": "Hola, soy Anónimo",
            "description": "Saludo anónimo"
        }
    ],
    "Persona.caminar": [
        {
            "instanceArgs": {"nombre": "Ana"},
            "args": {"pasos": 10},
            "expected": "Caminé 10 pasos",
            "description": "Caminar 10 pasos"
        }
    ],
    "Persona.metodo_estatico": [
        {
            "args": {},
            "expected": "Soy estático",
            "description": "Método estático"
        }
    ],
    "Calculadora.sumar": [
        {
            "instanceArgs": {"marca": "SuperCalc"},
            "args": {"a": 3, "b": 4},
            "expected": 7,
            "description": "Suma básica con calculadora"
        }
    ]
}</textarea>
                </div>
            </div>
        </div>
        
        <button id="run-btn" class="btn btn-primary">Ejecutar Tests</button>
        
        <div class="mt-4">
            <h3>Resultados:</h3>
            <div id="output" class="test-results-container"></div>
        </div>
    </div>
</body>
</html>
