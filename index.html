<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Tester en Navegador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Python Tester en Navegador</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="code" class="form-label">Código Python (debe contener una función solution)</label>
                    <textarea id="code" class="form-control" rows="10">def solution(input):
    # Escribe tu solución aquí
    return input</textarea>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="test-cases" class="form-label">Casos de Prueba (JSON)</label>
                    <textarea id="test-cases" class="form-control" rows="10">[
    {"input": 1, "expected": 1},
    {"input": "hello", "expected": "hello"},
    {"input": [1,2,3], "expected": [1,2,3]}
]</textarea>
                </div>
            </div>
        </div>
        
        <button id="run-btn" class="btn btn-primary">Ejecutar Tests</button>
        
        <div class="mt-4">
            <h3>Resultados:</h3>
            <pre id="output" class="bg-light p-3 border rounded"></pre>
        </div>
    </div>

    <!-- Cargar Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
