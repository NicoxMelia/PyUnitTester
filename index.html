<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Tester Avanzado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="./css/index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script src="./js/index.js" defer></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Python Tester Avanzado</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="code" class="form-label">Código Python</label>
                    <textarea id="code" class="form-control" rows="15">def suma(a, b):
    print(f"Sumando {a} + {b}")
    return a + b

def factorial(n):
    print(f"Calculando factorial de {n}")
    if n == 0:
        return 1
    return n * factorial(n-1)</textarea>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="test-cases" class="form-label">Casos de Prueba (JSON)</label>
                    <textarea id="test-cases" class="form-control" rows="15">{
    "suma": [
        {
            "args": {"a": 2, "b": 3},
            "expected": 5,
            "description": "Suma básica"
        },
        {
            "args": {"a": -1, "b": 1},
            "expected": 0,
            "description": "Suma con negativos"
        }
    ],
    "factorial": [
        {
            "args": {"n": 5},
            "expected": 120,
            "description": "Factorial de 5"
        },
        {
            "args": {"n": 0},
            "expected": 1,
            "description": "Factorial de 0 (caso base)"
        }
    ]
}</textarea>
                </div>
            </div>
        </div>
        
        <button id="run-btn" class="btn btn-primary">Ejecutar Tests</button>
        
        <div class="mt-4">
            <h3>Resultados:</h3>
            <div id="output" class="test-results-container"></div>
        </div>
    </div>
</body>
</html>
